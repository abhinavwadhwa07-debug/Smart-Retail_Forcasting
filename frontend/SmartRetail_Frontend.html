<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Retail Intelligence Network</title>
<meta name="description" content="Demand forecasting, stock-risk detection and supply-chain transparency for retail stores.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<!--
  SMART RETAIL INTELLIGENCE NETWORK — FRONTEND
  ============================================
  Single-file app: HTML + CSS + vanilla JS, no build step, no framework.

  CONNECTING YOUR BACKEND
  -----------------------
  1. Open Settings in the app, choose "Live API" and enter your base URL (e.g. https://api.yourstore.in).
     Or set it in code: CONFIG.apiBase below, or add ?api=https://... to the page URL.
  2. Your backend must implement the endpoints listed in API_CONTRACT (see Settings page for the table).
     JSON shapes are exactly the ones in MOCK_DATA, so the sample data doubles as the spec.
  3. Enable CORS for the page's origin. Auth: if CONFIG.authToken is set, every request
     sends "Authorization: Bearer <token>".
  If a live call fails, the app shows a banner and falls back to sample data so the UI never breaks.
-->
<style>
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#F7FAF9; --ink:#12302F; --text:#1F2B2A; --muted:#5A6E6C; --line:#D5E0DD;
  --teal:#1F7A78; --saffron:#C9800F; --coral:#C9502F; --sage:#4F8468; --slate:#3D6A88; --plum:#7A4E7E;
  --tint:#E6EFEC; --teal-tint:#DDEFED; --coral-tint:#F8E5DE; --saffron-tint:#F8EBD3; --sage-tint:#E1EEE6; --slate-tint:#E0E9F0;
  --side:#12302F; --side-text:#CFE3DF; --side-active:#1F4A48;
  --shadow:0 1px 2px rgba(18,48,47,.06),0 4px 14px rgba(18,48,47,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0C1617; --surface:#132324; --surface2:#172B2C; --ink:#E6F0EE; --text:#D7E4E2; --muted:#93AAA7; --line:#27403F;
  --teal:#4FB5B1; --saffron:#EBA640; --coral:#EC7553; --sage:#74B08F; --slate:#7FA9C9; --plum:#B78CBB;
  --tint:#1A3132; --teal-tint:#173A3A; --coral-tint:#3A231C; --saffron-tint:#3A2E17; --sage-tint:#1C3427; --slate-tint:#1C2E3B;
  --side:#0A1314; --side-text:#A9C6C1; --side-active:#173334;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
:lang(hi) body, html[lang="hi"] body{font-family:"Noto Sans Devanagari",var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-text);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:16px;line-height:1.1;color:#fff;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--side-text);opacity:.8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--side-text);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-active);color:#fff}
.nav a.on{background:var(--side-active);color:#fff}
.nav a svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;background:#C9502F;color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:0 7px;line-height:18px}
.side .foot{margin-top:auto;font-size:11.5px;opacity:.75;padding:10px 8px;line-height:1.4}
/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top h1{font-family:var(--f-display);font-size:22px;margin:0;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.top .meta{color:var(--muted);font-size:12.5px}
.top .grow{flex:1}
.menu-btn{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.chip-src{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
.chip-src.mock{background:var(--saffron-tint);color:var(--saffron)}
.chip-src.live{background:var(--sage-tint);color:var(--sage)}
.chip-src i{width:7px;height:7px;border-radius:50%;background:currentColor}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:17px;height:17px}
.banner{margin:14px 28px 0;padding:10px 14px;border-radius:10px;background:var(--coral-tint);color:var(--coral);font-weight:500;font-size:13.5px;display:flex;gap:10px;align-items:center}
.banner button{margin-left:auto}
#view:focus{outline:none}
.content{padding:22px 28px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
/* cards */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-kpi.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--f-display);font-size:17px;margin:0 0 4px;color:var(--ink);font-weight:700}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.card-h > div{min-width:0}
.card-h .sub{margin:0}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--ink);line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.alert .v{color:var(--coral)} .kpi.good .v{color:var(--sage)} .kpi.warn .v{color:var(--saffron)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.c-healthy{background:var(--sage-tint);color:var(--sage)} .c-watch{background:var(--saffron-tint);color:var(--saffron)}
.c-expiry{background:var(--coral-tint);color:var(--coral)} .c-dead{background:var(--tint);color:var(--ink)} .c-shelf{background:var(--slate-tint);color:var(--slate)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.ok{background:var(--sage);color:#fff;border-color:var(--sage)}
.btn.sm{padding:5px 10px;font-size:12.5px}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
select,input[type=text],input[type=url],input[type=search],input[type=password]{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13.5px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--coral)}
/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
th.s{cursor:pointer} th.s:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:9px;background:var(--tint);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:9px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;color:var(--ink)} .li .s{font-size:12.5px;color:var(--muted)}
.li .r{margin-left:auto;text-align:right;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* charts */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:7px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:3;line-height:1.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
/* tasks */
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.task .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.task .ic svg{width:20px;height:20px}
.task .tt{font-weight:600;color:var(--ink);font-size:15px}
.task .rs{font-size:13px;color:var(--muted)}
.task .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.task.done{opacity:.55} .task.done .tt{text-decoration:line-through}
.prog{height:10px;border-radius:9px;background:var(--tint);overflow:hidden}
.prog i{display:block;height:100%;background:var(--sage);transition:width .3s}
/* map */
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;min-height:560px}
.tree{font-size:13.5px;overflow:auto;max-height:72vh;padding-right:6px}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
.tree > ul{padding-left:0;border-left:0}
.tree li{margin:1px 0}
.tree .node{display:flex;gap:7px;align-items:center;padding:4px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.tree .node:hover{background:var(--surface2)}
.tree .node.sel{background:var(--teal-tint);border-color:var(--teal)}
.tree .node.hit .lbl{color:var(--coral);font-weight:600}
.tree .tw{width:16px;height:16px;display:grid;place-items:center;color:var(--muted);flex:none;transition:transform .15s}
.tree li.open > .node .tw{transform:rotate(90deg)}
.tree li:not(.open) > ul{display:none}
.tree .d1 > .node .lbl{font-weight:600;color:var(--ink)}
.tree .cnt{font-size:11px;color:var(--muted)}
pre.prompt{font-family:var(--f-mono);font-size:12.3px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:12px;margin:0;max-height:260px;overflow:auto}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.detail h3{font-family:var(--f-display);font-size:21px;margin:0 0 8px;color:var(--ink);line-height:1.2}
.lbl-s{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin:16px 0 6px}
.detail ul{margin:0;padding-left:18px}
/* drawer & toast */
.scrim{position:fixed;inset:0;background:rgba(10,20,20,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .25s;box-shadow:-8px 0 30px rgba(0,0,0,.15);overflow-y:auto;padding:22px;padding-right:max(22px,env(safe-area-inset-right))}
.drawer.on{transform:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.ring{--p:50;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c,var(--teal)) calc(var(--p)*1%),var(--tint) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--ink)}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.sim-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.sim-out div{background:var(--surface2);border-radius:10px;padding:10px}
.sim-out b{display:block;font-family:var(--f-display);font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.sim-out small{color:var(--muted);font-size:12px}
@media (max-width:1100px){.g-2{grid-template-columns:1fr}.map-wrap{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:260px;z-index:25;transform:translateX(-100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top))}
  .side.on{transform:none}
  .menu-btn{display:grid}
  .top{padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));top:0}
  .content{padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
  .banner{margin:12px 16px 0}
  .g-2e{grid-template-columns:1fr}
  .g-kpi,.g-kpi.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hide-sm{display:none}
  .task{grid-template-columns:auto minmax(0,1fr)}
  .task .act{grid-column:1/-1;justify-content:flex-start}
  .sim-out{grid-template-columns:1fr 1fr 1fr}
  .top h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#1F7A78"/><g stroke="#A9D3CF" stroke-width="1.3" opacity=".9"><path d="M10 12 20 20M10 20H20M10 28 20 20M20 20 30 14M20 20 30 26"/></g><g fill="#fff"><circle cx="10" cy="12" r="2.6"/><circle cx="10" cy="20" r="2.6"/><circle cx="10" cy="28" r="2.6"/></g><circle cx="20" cy="20" r="3.4" fill="#12302F" stroke="#fff" stroke-width="1.4"/><g fill="#E8A33D"><circle cx="30" cy="14" r="3"/><circle cx="30" cy="26" r="3"/></g></svg>
      <div><b>Smart Retail</b><small data-i18n="tagline">Intelligence Network</small></div>

  </aside>
  <div class="main">

      <button class="iconbtn menu-btn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div><h1 id="pageTitle">Overview</h1><div class="meta" id="meta"></div></div>

    <div id="bannerSlot"></div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>
<div class="toast" id="toast" role="status"></div>

py (cleaning + zero-filled daily grid), features.py (calendar, lag 1/7/14/30, rolling 7/30, price ratio), forecasting.py (WAPE + expanding-window CV with LightGBM Tweedie) and pricing_engine.py (log-log elasticity + bounded profit optimisation with a 1.15x cost floor). Keep code typed, tested with pytest, leakage-free, and explainable.","kind":"root","children":[{"label":"Problem & Vision","desc":"The retail pain points the network exists to remove, and what success looks like.","details":[],"status":"live","prompt":"Write a crisp problem statement and vision for a retail AI that tackles expired stock, dead stock, weak shelf presence, missed demand hikes and opaque supply chains. Quantify the cost of each pain point for a mid-size Indian grocery/FMCG store and define measurable success targets.","kind":"branch","children":[{"label":"Expired & near-expiry stock","desc":"Perishables and short-shelf-life goods that cross their expiry date unsold become write-offs and waste.","details":["Signal: on-hand batch qty > forecast demand over remaining shelf life","Cost: write-off value, disposal cost, lost shelf space","Lever: FEFO picking, early markdown, transfer, donation"],"status":"planned","prompt":"Context: Smart Retail Intelligence Network > Problem & Vision > Expired & near-expiry stock. Perishables and short-shelf-life goods that cross their expiry date unsold become write-offs and waste. Known points: Signal: on-hand batch qty > forecast demand over remaining shelf life; Cost: write-off value, disposal cost, lost shelf space; Lever: FEFO picking, early markdown, transfer, donation. Task: design and implement this part in Python for the existing repo (src/ modules, pandas, LightGBM, SciPy). Give the approach, data needed, code with type hints, pytest tests, and how its output feeds the action engine.","kind":null,"children":[],"id":"n-1-1"},{"label":"Dead & slow-moving stock","desc":"SKUs with little or no demand that tie up cash and shelf space.","details":["Signal: long zero-sale streaks, falling sell-through, high weeks-of-cover","Lever: clearance, bundling, return-to-vendor, delist"],"status":"planned","prompt":"Context: Smart Retail Intelligence Network > Problem & Vision > Dead & slow-moving stock. SKUs with little or no demand that tie up cash and shelf space. Known points: Signal: long zero-sale streaks, falling sell-through, high weeks-of-cover; Lever: clearance, bundling, return-to-vendor, delist. Task: design and implement this part in Python for the existing repo (src/ modules, pandas, LightGBM, SciPy). Give the approach, data needed, code with type hints, pytest tests, and how its output feeds the action engine.","kind":null,"children":[],"id":"n-1-2"},{"label":"Weak shelf presence","desc":"Products that exist in the store but are not visible or available enough to sell (phantom stock, poor facing, out-of-shelf).","details":["Signal: system stock > 0 but sales = 0 for an unusually long run","Signal: sales far below peers with similar price and category","Lever: re-facing, planogram fix, cycle count"],"status":"planned","prompt":"Context: Smart Retail Intelligence Network > Problem & Vision > Weak shelf presence. Products that exist in the store but are not visible or available enough to sell (phantom stock, poor facing, out-of-shelf). Known points: Signal: system stock > 0 but sales = 0 for an unusually long run; Signal: sales far below peers with similar price and category; Lever: re-facing, planogram fix, cycle count. Task: design and implement this part in Python for the existing repo (src/ modules, pandas, LightGBM, SciPy). Give the approach, data needed, code with type hints, pytest tests, and how its output feeds the action engine.","kind":null,"children":[],"id":"n-1-3"},{"label":"Missed demand hikes","desc":"Sudden surges (festivals, weather, viral trends, competitor stockout) that cause stockouts and lost sales.","details":["Signal: forecast residuals breaking the P90 band, changepoints","Lever: early reorder, safety stock bump, staff reallocation"],"status":"planned","prompt":"Context: Smart Retail Intelligence Network > Problem & Vision > Missed demand hikes. Sudden surges (festivals, weather, viral trends, competitor stockout) that cause stockouts and lost sales. Known points: Signal: forecast residuals breaking the P90 band, changepoints; Lever: early reorder, safety stock bump, staff reallocation. Task: design and implement this part in Python for the existing repo (src/ modules, pandas, LightGBM, SciPy). Give the approach, data needed, code with type hints, pytest tests, and how its output feeds the action engine.","kind":null,"children":[],"id":"n-1-4"},{"label":"Opaque supply chain","desc":"Store teams cannot see where an order is, how reliable a supplier is, or which batch came from where.","details":["Signal: lead-time variance, OTIF misses, short shipments","Lever: supplier scorecards, ETA prediction, batch traceability"],"status":"planned","prompt":"Context: Smart Retail Intelligence Network > Problem & Vision > Opaque supply chain. Store teams cannot see where an order is, how reliable a supplier is, or which batch came from where. Known points: Signal: lead-time variance, OTIF misses, short shipments; Lever: supplier scorecards, ETA prediction, batch traceability. Task: design and implement this part in Python for the existing repo (src/ modules, pandas, LightGBM, SciPy). Give the approach, data needed, code with type hints, pytest tests, and how its output feeds the action engine.","kind":null,"children":[],"id":"n-1-5"},{"label":"Worker burden","desc":"Staff spend time on manual counts, guesswork ordering and firefighting instead of serving customers.","details":["Goal: one short, ranked task list per shift","Goal: every alert comes with a reason in plain language (English / Hindi)"],"status":"planned","prompt":"Context: Smart Retail Intelligence Network > Problem & Vision > Worker burden. Staff spend time on manual counts, guesswork ordering and fir /* ============================================================ API LAYER (live with mock fallback) */
const MOCK = JSON.parse(JSON.stringify(window.MOCK_DATA));
function mockRoute(method, path, body){
  if(!state.mockTasks) state.mockTasks = LS.get("mockTasks", null) || JSON.parse(JSON.stringify(MOCK.tasks));
  const m = (re) => path.match(re);
  let r;
  if(path === "/api/ping") return {ok:true, version:"mock-1"};
  if(path === "/api/summary"){ const s={...MOCK.summary}; s.open_tasks = state.mockTasks.filter(x=>x.status==="open").length; return s; }
  if(path === "/api/skus") return MOCK.skus;
  if((r = m(/^\/api\/skus\/([\w-]+)\/series$/))) return MOCK.series[r[1]] || null;
  if(path === "/api/batches") return MOCK.batches;
  if(path === "/api/spikes") return MOCK.spikes;
  if(path === "/api/suppliers") return MOCK.suppliers;
  if(path === "/api/map") return MOCK.map;
  if(path === "/api/tasks" && method === "GET") return state.mockTasks;
  if(path === "/api/tasks" && method === "POST"){
    const task = {id:"t"+Date.now(), status:"open", minutes:8, urgency:3, role:"floor", impact_rs:0, ...body};
    task.priority = Math.round(task.impact_rs * task.urgency / Math.max(task.minutes,1));
    state.mockTasks.unshift(task); LS.set("mockTasks", state.mockTasks); return task;
  }
  if((r = m(/^\/api\/tasks\/([\w-]+)$/)) && method === "PATCH"){
    const task = state.mockTasks.find(x=>x.id===r[1]); if(task) Object.assign(task, body); LS.set("mockTasks", state.mockTasks); return task;
  }
  throw new Error("No mock route for " + method + " " + path);
}
async function api(path, {method="GET", body}={}){
  if(state.mode === "live" && state.apiBase){
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), CONFIG.timeoutMs);
    try{
      const headers = {"Accept":"application/json"};
      if(body) headers["Content-Type"] = "application/json";
      if(state.token) headers["Authorization"] = "Bearer " + state.token;
      const res = await fetch(state.apiBase.replace(/\/$/,"") + path, {method, headers, body: body?JSON.stringify(body):undefined, signal: ctl.signal});
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if(state.liveError){ state.liveError = null; renderBanner(); }
      return data;
    }catch(e){
      state.liveError = e.name === "AbortError" ? "timeout" : e.message; renderBanner();
      return mockRoute(method, path, body);
    }finally{ clearTimeout(tm); }
  }
  return mockRoute(method, path, body);
}
async function getCached(path){ if(!(path in state.cache)) state.cache[path] = await api(path); return state.cache[path]; }
function clearCache(){ state.cache = {}; }

/* ============================================================ CHARTS (vanilla SVG) */
function scale(d0,d1,r0,r1){ const f = v => r0 + (v-d0)/(d1-d0||1)*(r1-r0); f.inv = p => d0 + (p-r0)/(r1-r0||1)*(d1-d0); return f; }
function niceMax(v){ if(v<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function ticks(max, n=4){ const st = niceMax(max/n); const out=[]; for(let v=0; v<=max+1e-9; v+=st) out.push(+v.toFixed(6)); return out; }

/* Time-series chart: layers = [{kind:"band",lo,hi,color},{kind:"line",values,color,width,dash},{kind:"bars",values,color,colors}] */
function tsChart(el, {dates, layers, vline, height=280, yLabel="", tipFmt}){
  const W = Math.max(el.clientWidth || 640, 300), H = height, m = {l:42,r:12,t:12,b:28};
  const n = dates.length;
  let ymax = 0; layers.forEach(L => (L.hi||L.values).forEach(v => { if(v!=null && v>ymax) ymax=v; }));
  ymax = niceMax(ymax*1.08);
  const x = scale(0, n-1, m.l + 6, W - m.r - 6), y = scale(0, ymax, H - m.b, m.t);
  const bw = Math.max(1.5, (W - m.l - m.r) / n * .72);
  let g = "";
  ticks(ymax).forEach(v => { g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}" />`; g += `<text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; });
  const step = Math.ceil(n / Math.max(3, Math.floor(W/90)));
  for(let i=0;i<n;i+=step) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fdate(dates[i])}</text>`;
  if(yLabel) g += `<text x="${m.l}" y="${m.t-2}" text-anchor="start" font-weight="600">${esc(yLabel)}</text>`;
  if(vline!=null && vline>=0){ g += `<line x1="${x(vline)}" x2="${x(vline)}" y1="${m.t}" y2="${H-m.b}" stroke="${css("--ink")}" stroke-dasharray="4 4" opacity=".6"/>`; }
  layers.forEach(L => {
    if(L.kind==="bars"){ L.values.forEach((v,i)=>{ if(v==null) return; const c = L.colors ? L.colors[i] : L.color; g += `<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(0,y(0)-y(v))}" rx="1.5" fill="${c}"/>`; }); }
    if(L.kind==="band"){ let top="", bot=""; L.hi.forEach((v,i)=>{ if(v==null) return; top += (top?"L":"M") + x(i) + "," + y(v); }); for(let i=n-1;i>=0;i--){ if(L.lo[i]==null) continue; bot += "L" + x(i) + "," + y(L.lo[i]); } if(top) g += `<path d="${top}${bot}Z" fill="${L.color}" opacity=".2"/>`; }
    if(L.kind==="line"){ let d="", pen=false; L.values.forEach((v,i)=>{ if(v==null){pen=false;return;} d += (pen?"L":"M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen=true; }); g += `<path d="${d}" fill="none" stroke="${L.color}" stroke-width="${L.width||2}" ${L.dash?`stroke-dasharray="${L.dash}"`:""} stroke-linejoin="round" stroke-linecap="round"/>`; }
  });
  g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="${css("--muted")}" opacity="0"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel||"chart")}">${g}<rect class="hit" x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector(".xh");
  const move = ev => {
    const pt = svg.getBoundingClientRect(); const px = (ev.touches?ev.touches[0].clientX:ev.clientX) - pt.left; const sx = W / pt.width;
    const i = Math.max(0, Math.min(n-1, Math.round(x.inv(px*sx))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity",".5");
    tip.innerHTML = `<b>${fdate(dates[i])}</b><br>` + (tipFmt ? tipFmt(i) : "");
    tip.style.left = (x(i)/sx) + "px"; tip.style.top = (m.t/sx + 10) + "px"; tip.style.opacity = 1;
  };
  svg.addEventListener("mousemove", move); svg.addEventListener("touchmove", move, {passive:true});
  svg.addEventListener("mouseleave", ()=>{ tip.style.opacity=0; xh.setAttribute("opacity","0"); });
}
/* Scatter with log-x */
function scatter(el, {points, xLabel, yLabel, height=320, onClick}){
  const W = Math.max(el.clientWidth || 640, 300), H = height, m = {l:44,r:16,t:16,b:40};
  const xs = points.map(p=>Math.log10(Math.max(p.x,.1))), ys = points.map(p=>p.y);
  const x0 = Math.floor(Math.min(...xs)), x1 = Math.ceil(Math.max(...xs)); const ymax = niceMax(Math.max(...ys)*1.1);
  const x = scale(x0, x1, m.l+10, W-m.r-10), y = scale(0, ymax, H-m.b, m.t);
  let g = "";
  ticks(ymax).forEach(v => { g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${fmt(v,1)}</text>`; });
  for(let e=x0;e<=x1;e++) g += `<line x1="${x(e)}" x2="${x(e)}" y1="${m.t}" y2="${H-m.b}" stroke="${css("--line")}"/><text x="${x(e)}" y="${H-m.b+16}" text-anchor="middle">${fmt(Math.pow(10,e),e<0?1:0)}</text>`;
  g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(1)}" y2="${y(1)}" stroke="${css("--muted")}" stroke-dasharray="3 3"/>`;
  g += `<text x="${(m.l+W-m.r)/2}" y="${H-4}" text-anchor="middle">${esc(xLabel)}</text><text x="${m.l}" y="${m.t-4}" font-weight="600">${esc(yLabel)}</text>`;
  points.forEach((p,i) => { const r = 6 + Math.sqrt(p.size||0)/4; g += `<g class="pt" data-i="${i}" style="cursor:pointer"><circle cx="${x(xs[i])}" cy="${y(p.y)}" r="${Math.min(r,22)}" fill="${p.color}" opacity=".85" stroke="${css("--surface")}" stroke-width="2"/>${p.label?`<text x="${x(xs[i])+ (xs[i]>x1-.4?-10:10)}" y="${y(p.y)-8}" text-anchor="${xs[i]>x1-.4?"end":"start"}" fill="${css("--ink")}" style="fill:var(--ink)">${esc(p.label)}</text>`:""}</g>`; });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel)}">${g}</svg><div class="tip"></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  el.querySelectorAll(".pt").forEach(node => {
    const p = points[+node.dataset.i];
    node.addEventListener("mouseenter", ()=>{ const b=svg.getBoundingClientRect(), sx=W/b.width; tip.innerHTML=p.tip; tip.style.left=(x(xs[+node.dataset.i])/sx)+"px"; tip.style.top=(y(p.y)/sx)+"px"; tip.style.opacity=1; });
    node.addEventListener("mouseleave", ()=>tip.style.opacity=0);
    node.addEventListener("click", ()=>onClick && onClick(p));
  });
}
/* XY line chart for the price simulator */
function xyChart(el, {xs, lines, markers=[], xLabel, height=260, vx}){
  const W = Math.max(el.clientWidth || 600, 300), H = height, m = {l:52,r:14,t:14,b:38};
  let ymin = Infinity, ymax = -Infinity; lines.forEach(L=>L.values.forEach(v=>{ ymin=Math.min(ymin,v); ymax=Math.max(ymax,v); }));
  ymin = Math.min(0, ymin); ymax = niceMax(ymax*1.08);
  const x = scale(xs[0], xs[xs.length-1], m.l, W-m.r), y = scale(ymin, ymax, H-m.b, m.t);
  let g = "";
  ticks(ymax).forEach(v=>{ g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${rs(v)}</text>`; });
  const nt = 6; for(let i=0;i<=nt;i++){ const v = xs[0] + (xs[xs.length-1]-xs[0])*i/nt; g += `<text x="${x(v)}" y="${H-m.b+16}" text-anchor="middle">${rs(v)}</text>`; }
  g += `<text x="${(m.l+W-m.r)/2}" y="${H-4}" text-anchor="middle">${esc(xLabel)}</text>`;
  if(vx!=null) g += `<line x1="${x(vx)}" x2="${x(vx)}" y1="${m.t}" y2="${H-m.b}" stroke="${css("--coral")}" stroke-width="2"/>`;
  lines.forEach(L=>{ g += `<path d="${L.values.map((v,i)=>(i?"L":"M")+x(xs[i]).toFixed(1)+","+y(v).toFixed(1)).join("")}" fill="none" stroke="${L.color}" stroke-width="${L.width||2.4}" ${L.dash?`stroke-dasharray="${L.dash}"`:""}/>`; });
  markers.forEach(mk=>{ g += `<circle cx="${x(mk.x)}" cy="${y(mk.y)}" r="6" fill="${mk.color}" stroke="${css("--surface")}" stroke-width="2"/>`; });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="price simulator">${g}</svg>`;
}

const PAGES = ["overview","forecast","health","expiry","spikes","peers","tasks","suppliers","map","settings"];

function go(page, param){ location.hash = page + (param ? "-sku-" + param : ""); }
async function renderNav(){

  $("#nav").innerHTML = PAGES.map(p => `<a href="#${p}" class="${p===current?"on":""}" ${p===current?'aria-current="page"':""}>${svgI(p)}<span>${esc(t(p))}</span>${p==="tasks"&&open?`<span class="badge">${open}</span>`:""}</a>`).join("");

async function route(){
  [current, pageParam] = parseHash();

/* demand model from the repo: Q = Q0 * (p0/p)^|e| */
const demandCurve = (q0, p0, p, e) => Math.max(q0 * Math.pow(p0/p, Math.abs(e)), 0);
VIEWS.expiry = async (v, param) => {
  const [skus, batches] = await Promise.all([getCached("/api/skus"), getCached("/api/batches")]);
  const risky = batches.filter(b=>b.expected_unsold>0.5).sort((a,b)=>b.value_at_risk-a.value_at_risk);
  let sel = risky.find(b=>b.sku_id===param) || risky.find(b=>b.days_left<=3) || risky[0];
  $("#meta").textContent = `${risky.length} ${t("batch").toLowerCase()} · ${rs(risky.reduce((a,b)=>a+b.value_at_risk,0))}`;
  v.innerHTML = `
  <div class="grid g-2">
    <div class="card"><h2>${t("ex_title")}</h2><p class="sub">${t("ex_sub")}</p>
      <div class="tbl-wrap"><table><thead><tr><th>${t("sku")}</th><th class="n">${t("qty")}</th><th class="n">${t("daysleft")}</th><th class="n">${t("unsold")}</th><th class="n">${t("pexp")}</th><th class="n">${t("value")}</th></tr></thead>
      <tbody id="bt"></tbody></table></div></div>
    <div class="card" id="sim"></div>
  </div>`;
  const renderTable = () => { $("#bt").innerHTML = risky.map(b=>`<tr class="click" data-b="${b.id}" style="${b.id===sel.id?"background:var(--teal-tint)":""}"><td><b>${esc(skuName(skus,b.sku_id))}</b><div class="muted" style="font-size:12px"><span class="hide-sm">${esc(b.id)} · </span>${fdate(b.expiry_date)}</div></td>
      <td class="n">${b.qty}</td><td class="n" style="color:${b.days_left<=2?"var(--coral)":"inherit"};font-weight:${b.days_left<=2?600:400}">${b.days_left}</td><td class="n">${fmt(b.expected_unsold,1)}</td><td class="n">${fmt(b.p_expire*100)}%</td><td class="n"><b>${rs(b.value_at_risk)}</b></td></tr>`).join("");
    $("#bt").querySelectorAll("tr").forEach(tr=>tr.onclick=()=>{ sel = risky.find(b=>b.id===tr.dataset.b); renderTable(); renderSim(); }); };
  const renderSim = () => {
    const sku = skus.find(s=>s.id===sel.sku_id); const q0 = sku.health.daily_rate * sel.days_left; const p0 = sku.price, c = sku.unit_cost, inv = sel.qty;
    const lo = Math.round(c*0.7), hi = Math.round(p0*1.25); const xs = []; for(let p=lo;p<=hi;p+=Math.max(0.5,(hi-lo)/120)) xs.push(p);
    const sold = p => Math.min(demandCurve(q0,p0,p,sku.elasticity), inv);
    const rev = xs.map(p => p*sold(p)); const prof = xs.map(p => (p-c)*sold(p));
    const bi = rev.indexOf(Math.max(...rev)); const best = xs[bi];
    // repo optimiser: bounded [1.15c, min(1.2*hist_max, max(2*ref, 10c))] maximising (p-c)*sold
    const rlo = c*1.15, rhi = Math.min(p0*1.2, Math.max(p0*2, c*10)); let rb = rlo, rv = -1; for(let p=rlo;p<=rhi;p+=.25){ const val=(p-c)*sold(p); if(val>rv){rv=val;rb=p;} }
    let price = Math.round(best);
    const id = "sim";
    $("#"+id).innerHTML = `<h2>${t("sim_title")}</h2><p class="sub">${esc(sku.name)} · ${esc(sel.id)} · ${sel.qty} ${t("units")} · ${sel.days_left} ${t("days")}</p>
      <label for="pr" class="row" style="justify-content:space-between"><span>${t("price")}</span><b class="num" id="prv"></b></label>

  const weekly = sers.map(se => { const a = se.actual.slice(-42); return [0,1,2,3,4,5].map(w=>a.slice(w*7,w*7+7).reduce((x,y)=>x+y,0)); });
  const avg = weekly.map(w=>w.reduce((a,b)=>a+b,0)/6);
  const peerPriceRatio = peers.length ? sku.price / (peers.reduce((a,p)=>a+p.price,0)/peers.length) : 1;

    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>${t("sku")}</th><th>${t("status")}</th><th class="n">${t("avgweek")}</th><th class="n">${t("price")}</th><th class="n">${t("onhand")}</th><th class="n">${t("since")}</th><th class="n">${t("cover")}</th></tr></thead>
    <tbody>${group.map((g,i)=>`<tr ${i===0?'style="background:var(--coral-tint)"':""}><td><b>${esc(g.name)}</b></td><td>${pill(g.health.cls)}</td><td class="n">${fmt(avg[i],1)}</td><td class="n">${rs(g.price)}</td><td class="n">${g.health.on_hand}</td><td class="n">${g.health.days_since_sale}</td><td class="n">${fmt(g.health.cover_weeks,1)}</td></tr>`).join("")}</tbody></table></div></div>`;

VIEWS.map = async (v) => {
  const root = await getCached("/api/map");
  let idx = 0; const all = []; (function walk(n, parent, depth){ n._id = "m"+(idx++); n._p = parent; n._d = depth; all.push(n); (n.children||[]).forEach(c=>walk(c, n, depth+1)); })(root, null, 0);
  const open = new Set([root._id]); let sel = root, q = "";
  $("#meta").textContent = `${all.length} nodes · ${root.children.length} branches`;
  v.innerHTML = `<div class="card"><div class="card-h"><div><h2>${t("mp_title")}</h2><p class="sub">${t("mp_sub")}</p></div>
    <div class="row"><input type="search" id="mq" placeholder="${t("search_map")}" aria-label="${t("search")}"><button class="btn sm" id="mx">${t("expand")}</button><button class="btn sm" id="mc">${t("collapse")}</button></div></div>
    <div class="map-wrap"><div class="tree" id="tree"></div><div class="card detail" id="md" style="box-shadow:none;background:var(--surface2)"></div></div>
    <div class="legend">${Object.entries(STATUS_LABEL).map(([k,l])=>`<span><i style="background:${STATUS_COLOR[k]};width:9px;height:9px;border-radius:50%"></i>${esc(t(l))}</span>`).join("")}</div></div>`;
  const hit = n => q && (n.label+" "+n.desc+" "+(n.details||[]).join(" ")).toLowerCase().includes(q);
  const li = n => { const kids = n.children||[]; return `<li class="${open.has(n._id)?"open":""} d${n._d}"><div class="node ${n===sel?"sel":""} ${hit(n)?"hit":""}" data-id="${n._id}" tabindex="0" role="treeitem" aria-expanded="${kids.length?open.has(n._id):""}">
     <span class="tw">${kids.length?'<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>':""}</span>
     <span class="dot" style="width:8px;height:8px;background:${STATUS_COLOR[n.status]}"></span><span class="lbl">${esc(n.label)}</span>${kids.length?`<span class="cnt">${kids.length}</span>`:""}</div>
     ${kids.length?`<ul role="group">${kids.map(li).join("")}</ul>`:""}</li>`; };
  const ctx = n => { const path=[]; for(let a=n;a;a=a._p) path.unshift(a.label); const md = (x,d=0)=>`${"  ".repeat(d)}- **${x.label}** [${STATUS_LABEL[x.status]}]: ${x.desc}\n` + (x.details||[]).map(y=>`${"  ".repeat(d)}  - ${y}\n`).join("") + (x.children||[]).map(c=>md(c,d+1)).join("");
    return `PROJECT CONTEXT — Smart Retail Intelligence Network\nPath: ${path.join(" > ")}\n\n${root.prompt}\n\nBRANCH MAP:\n${md(n)}\nTASK: ${n.prompt}\n`; };
  const renderTree = () => { $("#tree").innerHTML = `<ul role="tree">${li(root)}</ul>`;
    $("#tree").querySelectorAll(".node").forEach(el=>{ const n = all.find(x=>x._id===el.dataset.id);
      const act = () => { if((n.children||[]).length){ open.has(n._id)?open.delete(n._id):open.add(n._id); } sel=n; renderTree(); renderDetail(); };
      el.onclick = act; el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } }; }); };
  const renderDetail = () => { const n = sel; const path=[]; for(let a=n._p;a;a=a._p) path.unshift(a);
    $("#md").innerHTML = `<div class="crumb">${path.map(a=>`<a href="#" data-j="${a._id}">${esc(a.label)}</a>`).join(" › ")}</div><h3>${esc(n.label)}</h3>
      <span class="pill" style="background:var(--surface);color:${STATUS_COLOR[n.status]};border:1px solid currentColor"><i></i>${esc(t(STATUS_LABEL[n.status]))}</span>
      <p style="margin:12px 0 0">${esc(n.desc)}</p>
      ${(n.details||[]).length?`<div class="lbl-s">${t("keypoints")}</div><ul>${n.details.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:""}
      <div class="lbl-s">${t("promptseed")}</div><pre class="prompt">${esc(n.prompt)}</pre>
      <div class="row" style="margin-top:10px"><button class="btn pri sm" id="cp1">${t("copyp")}</button><button class="btn sm" id="cp2">${t("copyc")}</button></div>
      ${(n.children||[]).length?`<div class="lbl-s">${t("inside")} (${n.children.length})</div><div class="chips">${n.children.map(c=>`<button class="chip" data-j="${c._id}">${esc(c.label)}</button>`).join("")}</div>`:""}`;
    $("#cp1").onclick = ()=>copyText(n.prompt); $("#cp2").onclick = ()=>copyText(ctx(n));
    $("#md").querySelectorAll("[data-j]").forEach(el=>el.onclick=e=>{ e.preventDefault(); const tgt = all.find(x=>x._id===el.dataset.j); for(let a=tgt._p;a;a=a._p) open.add(a._id); if((tgt.children||[]).length) open.add(tgt._id); sel=tgt; renderTree(); renderDetail(); }); };
  $("#mq").oninput = e => { q = e.target.value.trim().toLowerCase(); if(q.length>1) all.forEach(n=>{ if(hit(n)) for(let a=n._p;a;a=a._p) open.add(a._id); }); renderTree(); };
  $("#mx").onclick = ()=>{ all.forEach(n=>open.add(n._id)); renderTree(); };
  $("#mc").onclick = ()=>{ open.clear(); open.add(root._id); renderTree(); };
  renderTree(); renderDetail();
};

  const skus = await getCached("/api/skus"); const s = skus.find(x=>x.id===id); if(!s) return; const h = s.health;
  const d = $("#drawer"), sc = $("#scrim");
  d.innerHTML = `<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div style="min-width:0"><div class="muted" style="font-size:12.5px">${esc(s.category)}</div><h3 style="font-family:var(--f-display);font-size:22px;margin:2px 0 8px;color:var(--ink)">${esc(s.name)}</h3></div><button class="iconbtn" id="dc" aria-label="Close">✕</button></div>
    ${pill(h.cls)}<p style="margin:12px 0">${esc(h.reason)}</p>
    <div class="chart" id="dch"></div>
    <dl class="kv" style="margin-top:14px"><dt>${t("score")}</dt><dd>${h.score}/100</dd><dt>${t("onhand")}</dt><dd>${h.on_hand}</dd><dt>${t("cover")}</dt><dd>${fmt(h.cover_weeks,1)}</dd><dt>${t("trend")}</dt><dd>${fmt(h.trend,2)}x</dd>
      <dt>${t("since")}</dt><dd>${h.days_since_sale}</dd><dt>${t("atrisk")}</dt><dd>${h.at_risk_value?rs(h.at_risk_value):"–"}</dd><dt>${t("price")} / ${t("cost")}</dt><dd>${rs(s.price)} / ${rs(s.unit_cost)}</dd><dt>${t("shelf")}</dt><dd>${s.shelf_life_days} ${t("days")}</dd></dl>
    <div class="row" style="margin-top:18px"><a class="btn pri sm" href="#forecast-sku-${s.id}">${t("forecast")}</a><a class="btn sm" href="#peers-sku-${s.id}">${t("peers")}</a>${h.at_risk_value?`<a class="btn sm" href="#expiry-sku-${s.id}">${t("expiry")}</a>`:""}</div>`;
  d.classList.add("on"); sc.classList.add("on");
  const close = () => { d.classList.remove("on"); sc.classList.remove("on"); };
  $("#dc").onclick = close; sc.onclick = close; d.querySelectorAll("a").forEach(a=>a.addEventListener("click", close));
  const ser = await getCached(`/api/skus/${s.id}/series`);
  tsChart($("#dch"), {dates:ser.dates.slice(-56), height:170, vline: ser.dates.slice(-56).indexOf(ser.forecast_start), layers:[{kind:"line",values:ser.actual.slice(-56),color:css("--muted"),width:1.4},{kind:"line",values:ser.p50.slice(-56),color:css("--teal"),width:2.4}], tipFmt:i=>`${t("actual")}: <b>${ser.actual.slice(-56)[i]}</b>`});
}

/* ============================================================ BOOT */
let resizeFns = [];
function onResize(fn){ resizeFns.push(fn); }
let rT; addEventListener("resize", ()=>{ clearTimeout(rT); rT = setTimeout(()=>resizeFns.forEach(f=>{ try{f();}catch(e){} }), 150); });
addEventListener("hashchange", ()=>{ resizeFns = []; route(); });
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ state.lang=b.dataset.lang; LS.set("lang",state.lang); resizeFns=[]; route(); });
$("#themeBtn").onclick = ()=>{ state.theme = state.theme==="dark"?"light":"dark"; LS.set("theme",state.theme); resizeFns=[]; route(); };
$("#menuBtn").onclick = ()=>$("#side").classList.toggle("on");
addEventListener("keydown", e=>{ if(e.key==="Escape"){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); $("#side").classList.remove("on"); } });
route();
</script>
</body>
</html>
